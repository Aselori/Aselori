<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470" role="img" aria-labelledby="t d">
<title id="t">GET /aselori</title>
<desc id="d">Aselori's profile as an HTTP response: backend developer in Monterrey, learning AWS and networking. Stack: Node.js, Express, Fastify, PostgreSQL, Prisma, Docker, Linux, GitHub Actions, Next.js. Below, a log of visitors who sent a request.</desc>
<style>
  :root { --ink:#1f2328; --muted:#59636e; --panel:#f6f8fa; --rule:#d1d9e0; --key:#0550ae; --str:#0a3069; --ok:#1a7f37; --wip:#9a6700; --new:#ddf4ff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --muted:#9198a1; --panel:#151b23; --rule:#3d444d; --key:#79c0ff; --str:#a5d6ff; --ok:#3fb950; --wip:#d29922; --new:#0c2d4d; }
  }
  text { font-family: "iA Writer Mono S", "JetBrains Mono", ui-monospace, monospace; font-size: 14px; fill: var(--ink); white-space: pre; }
  .panel { fill: var(--panel); stroke: var(--rule); }
  .muted { fill: var(--muted); }
  .key { fill: var(--key); }
  .str { fill: var(--str); }
  .ok { fill: var(--ok); font-weight: 700; }
  .wip { fill: var(--wip); }
  .b { font-weight: 700; }
  .rule { stroke: var(--rule); }
  .newbg { fill: var(--new); opacity: 0; animation: flash 6s ease-out 1.2s infinite; }
  .newrow { opacity: 0; animation: arrive 6s ease-out 1.2s infinite; }
  @keyframes arrive { 0% { opacity: 0 } 5%,100% { opacity: 1 } }
  @keyframes flash { 0% { opacity: 0 } 5% { opacity: 1 } 60%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .newrow { animation: none; opacity: 1; } .newbg { animation: none; } }
</style>

<rect class="panel" x="1" y="1" width="838" height="468" rx="8"/>

<text x="24" y="38" class="muted">GET /aselori HTTP/1.1</text>
<text x="24" y="70"><tspan class="b">HTTP/1.1 </tspan><tspan class="ok">200 OK</tspan></text>
<text x="24" y="94"><tspan class="key">x-role</tspan>: backend developer</text>
<text x="24" y="116"><tspan class="key">x-location</tspan>: Monterrey, MX</text>
<text x="24" y="138"><tspan class="key">x-learning</tspan>: <tspan class="wip">aws (ec2, s3), networking</tspan></text>

<text x="24" y="176">{</text>
<text x="24" y="198">  <tspan class="key">"api"</tspan>: [<tspan class="str">"Node.js"</tspan>, <tspan class="str">"Express"</tspan>, <tspan class="str">"Fastify"</tspan>, <tspan class="str">"REST"</tspan>, <tspan class="str">"auth"</tspan>],</text>
<text x="24" y="220">  <tspan class="key">"data"</tspan>: [<tspan class="str">"PostgreSQL"</tspan>, <tspan class="str">"Prisma"</tspan>],</text>
<text x="24" y="242">  <tspan class="key">"platform"</tspan>: [<tspan class="str">"Docker"</tspan>, <tspan class="str">"Linux"</tspan>, <tspan class="str">"GitHub Actions"</tspan>],</text>
<text x="24" y="264">  <tspan class="key">"client"</tspan>: [<tspan class="str">"Next.js"</tspan>],</text>
<text x="24" y="286">  <tspan class="key">"languages"</tspan>: [<tspan class="str">"TypeScript"</tspan>, <tspan class="str">"Python"</tspan>, <tspan class="str">"SQL"</tspan>, <tspan class="str">"Bash"</tspan>]</text>
<text x="24" y="308">}</text>

