<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" role="img" aria-labelledby="t d">
<title id="t">Aselori</title>
<desc id="d">Backend developer learning cloud infrastructure. A request travels from client (Next.js) to API (Node.js, Express, Fastify) to data (PostgreSQL, Prisma), all on a platform of Docker, Linux and GitHub Actions. AWS EC2 and S3 are in progress.</desc>
<defs>
  <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" class="fl-line"/></marker>
</defs>
<style>
  :root { --ink:#1f2328; --muted:#59636e; --line:#c8d1da; --box:#f6f8fa; --req:#0969da; --res:#1a7f37; --learn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --muted:#9198a1; --line:#3d444d; --box:#151b23; --req:#4493f8; --res:#3fb950; --learn:#d29922; }
  }
  text { font-family: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, monospace; fill: var(--ink); }
  .name { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
  .lede { font-size: 14px; fill: var(--muted); }
  .node-t { font-size: 12px; fill: var(--muted); }
  .tool { font-size: 15px; font-weight: 600; }
  .cap { font-size: 12px; fill: var(--muted); }
  .learn { font-size: 12px; fill: var(--learn); }
  .fl-line { fill: var(--line); }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
  .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
  .cloud { fill: none; stroke: var(--learn); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .platform { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }

  .pkt { offset-path: path("M40 170 H685"); offset-rotate: 0deg; animation: travel 5s linear infinite; }
  .req { fill: var(--req); }
  .res { fill: var(--res); animation-name: back; }
  @keyframes travel { 0% { offset-distance: 0%; opacity: 1 } 45% { offset-distance: 100%; opacity: 1 } 46%,100% { offset-distance: 100%; opacity: 0 } }
  @keyframes back { 0%,49% { offset-distance: 100%; opacity: 0 } 50% { offset-distance: 100%; opacity: 1 } 95% { offset-distance: 0%; opacity: 1 } 96%,100% { offset-distance: 0%; opacity: 0 } }

  .lit { animation: 5s linear infinite; stroke: var(--line); }
  .lit-client { animation-name: lit-client; }
  .lit-api { animation-name: lit-api; }
  .lit-data { animation-name: lit-data; }
  @keyframes lit-client { 0%,3% { stroke: var(--line) } 4%,15% { stroke: var(--req) } 16%,79% { stroke: var(--line) } 80%,91% { stroke: var(--res) } 92%,100% { stroke: var(--line) } }
  @keyframes lit-api { 0%,19% { stroke: var(--line) } 20%,33% { stroke: var(--req) } 34%,61% { stroke: var(--line) } 62%,74% { stroke: var(--res) } 75%,100% { stroke: var(--line) } }
  @keyframes lit-data { 0%,38% { stroke: var(--line) } 39%,45% { stroke: var(--req) } 46%,56% { stroke: var(--res) } 57%,100% { stroke: var(--line) } }

  @media (prefers-reduced-motion: reduce) { .pkt { animation: none; opacity: 0; } .lit { animation: none; } }
</style>

<text class="name" x="24" y="46">Aselori</text>
<text class="lede" x="24" y="72">Backend developer, learning cloud infrastructure.</text>
<text class="lede" x="816" y="46" text-anchor="end">Monterrey, MX</text>

<!-- edges first, packets next, boxes on top so packets only show between nodes -->
<path class="edge" d="M48 170 H88" marker-end="url(#arr)"/>
<path class="edge" d="M260 170 H328" marker-end="url(#arr)"/>
<path class="edge" d="M520 170 H588" marker-end="url(#arr)"/>
<circle class="pkt req" r="5" cx="0" cy="0"/>
<circle class="pkt res" r="5" cx="0" cy="0"/>
<circle cx="40" cy="170" r="6" fill="none" stroke="var(--muted)" stroke-width="1.5"/>

<!-- AWS boundary: the part still being learned -->
<path class="cloud" d="M494 98 H796 a10 10 0 0 1 10 10 V238 a10 10 0 0 1 -10 10 H320 a10 10 0 0 1 -10 -10 V108 a10 10 0 0 1 10 -10 H322"/>
<text class="learn" x="328" y="102">aws, learning: EC2, S3</text>

<rect class="box lit lit-client" x="90" y="114" width="170" height="114" rx="6"/>
<text class="node-t" x="106" y="138">client</text>
<text class="tool" x="106" y="164">Next.js</text>
<text class="cap" x="106" y="212">TypeScript</text>

<rect class="box lit lit-api" x="330" y="114" width="190" height="114" rx="6"/>
<text class="node-t" x="346" y="138">api</text>
<text class="tool" x="346" y="164">Node.js</text>
<text class="tool" x="346" y="184">Express, Fastify</text>
<text class="cap" x="346" y="212">REST, auth, TypeScript</text>

<rect class="box lit lit-data" x="590" y="114" width="190" height="114" rx="6"/>
<text class="node-t" x="606" y="138">data</text>
<text class="tool" x="606" y="164">PostgreSQL</text>
<text class="tool" x="606" y="184">Prisma</text>
<text class="cap" x="606" y="212">schema design, SQL</text>

<text class="cap" x="106" y="250">tested with Playwright</text>

<rect class="platform" x="24" y="266" width="792" height="44" rx="6"/>
<text class="node-t" x="40" y="293">runs on</text>
<text class="tool" x="120" y="293">Docker</text>
<text class="tool" x="220" y="293">Linux</text>
<text class="tool" x="310" y="293">GitHub Actions</text>
<text class="cap" x="816" y="293" text-anchor="end" dx="-16">scripts in Bash, Python</text>
</svg>
