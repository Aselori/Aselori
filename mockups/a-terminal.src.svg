<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 430" width="840" height="430" role="img" aria-labelledby="t d">
<title id="t">aselori fastfetch</title>
<desc id="d">A terminal running fastfetch for Aselori: backend developer in Monterrey, open to internships. Stack: Node.js, Express, Fastify, PostgreSQL, Prisma, Docker, Linux, GitHub Actions, Next.js. Learning AWS EC2, S3 and networking.</desc>
<style>
  /* Catppuccin Latte (light) / Mocha (dark) */
  :root { --bg:#eff1f5; --fg:#4c4f69; --sub:#6c6f85; --line:#bcc0cc; --teal:#179299; --mauve:#8839ef; --blue:#1e66f5; --green:#40a02b; --peach:#fe640b; --yellow:#df8e1d; --red:#d20f39; --pink:#ea76cb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1e1e2e; --fg:#cdd6f4; --sub:#a6adc8; --line:#45475a; --teal:#94e2d5; --mauve:#cba6f7; --blue:#89b4fa; --green:#a6e3a1; --peach:#fab387; --yellow:#f9e2af; --red:#f38ba8; --pink:#f5c2e7; }
  }
  text { font-family: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, monospace; font-size: 14px; fill: var(--fg); white-space: pre; }
  .win { fill: var(--bg); }
  .sub { fill: var(--sub); }
  .k { font-weight: 700; }
  .box { fill: none; stroke-width: 1.5; }
  .ttl { font-weight: 700; }
  .knock { fill: var(--bg); }

  .c { fill: transparent; animation: type .01s forwards; }
  @keyframes type { to { fill: var(--fg) } }
  .out { opacity: 0; animation: show .2s ease-out 1.25s forwards; }
  @keyframes show { to { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .out { animation: none; opacity: 1; } .c { animation: none; fill: var(--fg); } }
</style>

<rect class="win" width="840" height="430" rx="10"/>

<text x="28" y="40"><tspan fill="var(--teal)" class="k">aselori</tspan> on <tspan fill="var(--mauve)">open-to-internships</tspan> <tspan fill="var(--green)">❯</tspan> <tspan class="c" style="animation-delay:0.30s">f</tspan><tspan class="c" style="animation-delay:0.37s">a</tspan><tspan class="c" style="animation-delay:0.44s">s</tspan><tspan class="c" style="animation-delay:0.51s">t</tspan><tspan class="c" style="animation-delay:0.58s">f</tspan><tspan class="c" style="animation-delay:0.65s">e</tspan><tspan class="c" style="animation-delay:0.72s">t</tspan><tspan class="c" style="animation-delay:0.79s">c</tspan><tspan class="c" style="animation-delay:0.86s">h</tspan></text>

<g class="out">
  <image x="28" y="76" width="190" height="190" href="__GIF__"/>

  <!-- about -->
  <rect class="box" x="250" y="72" width="562" height="96" rx="6" stroke="var(--blue)"/>
  <rect class="knock" x="264" y="64" width="62" height="16"/>
  <text class="ttl" x="270" y="76" fill="var(--blue)">about</text>
  <text x="270" y="102"><tspan class="k" fill="var(--peach)">role     </tspan><tspan class="sub">: </tspan>backend developer</text>
  <text x="270" y="126"><tspan class="k" fill="var(--pink)">location </tspan><tspan class="sub">: </tspan>Monterrey, MX</text>
  <text x="270" y="150"><tspan class="k" fill="var(--blue)">os       </tspan><tspan class="sub">: </tspan>Omarchy (Arch Linux)</text>

  <!-- stack -->
  <rect class="box" x="250" y="190" width="562" height="144" rx="6" stroke="var(--green)"/>
  <rect class="knock" x="264" y="182" width="62" height="16"/>
  <text class="ttl" x="270" y="194" fill="var(--green)">stack</text>
  <text x="270" y="220"><tspan class="k" fill="var(--mauve)">api      </tspan><tspan class="sub">: </tspan>Node.js, Express, Fastify, REST</text>
  <text x="270" y="244"><tspan class="k" fill="var(--blue)">data     </tspan><tspan class="sub">: </tspan>PostgreSQL, Prisma</text>
  <text x="270" y="268"><tspan class="k" fill="var(--teal)">platform </tspan><tspan class="sub">: </tspan>Docker, Linux, GitHub Actions</text>
  <text x="270" y="292"><tspan class="k" fill="var(--yellow)">client   </tspan><tspan class="sub">: </tspan>Next.js</text>
  <text x="270" y="316"><tspan class="k" fill="var(--green)">langs    </tspan><tspan class="sub">: </tspan>TypeScript, Python, SQL, Bash</text>

  <!-- learning: dashed, the one part still in progress -->
  <rect class="box" x="250" y="356" width="562" height="48" rx="6" stroke="var(--peach)" stroke-dasharray="6 5"/>
  <rect class="knock" x="264" y="348" width="80" height="16"/>
  <text class="ttl" x="270" y="360" fill="var(--peach)">learning</text>
  <text x="270" y="386"><tspan class="k" fill="var(--peach)">cloud    </tspan><tspan class="sub">: </tspan>AWS (EC2, S3), networking</text>

  <g>
    <rect x="28" y="290" width="16" height="16" rx="3" fill="var(--red)"/>
    <rect x="50" y="290" width="16" height="16" rx="3" fill="var(--green)"/>
    <rect x="72" y="290" width="16" height="16" rx="3" fill="var(--yellow)"/>
    <rect x="94" y="290" width="16" height="16" rx="3" fill="var(--blue)"/>
    <rect x="116" y="290" width="16" height="16" rx="3" fill="var(--mauve)"/>
    <rect x="138" y="290" width="16" height="16" rx="3" fill="var(--teal)"/>
    <rect x="160" y="290" width="16" height="16" rx="3" fill="var(--peach)"/>
    <rect x="182" y="290" width="16" height="16" rx="3" fill="var(--pink)"/>
  </g>
</g>
</svg>
